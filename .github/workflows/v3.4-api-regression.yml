name: v3.4.0 API regression
on:
  pull_request:
    branches: [main, perf/ai-webgpu-cache-fallback]
  push:
    branches: [feat/v3.4.0-free-ai-api-full]
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run viewpoint API unit tests
        run: node --test tests/viewpoint-api.test.cjs
      - name: Syntax-check serverless API
        run: node --check api/viewpoint.js
